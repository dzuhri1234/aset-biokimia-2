name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang pakej
        run: npm ci

      - name: Bina laman (Vite + Panda CSS)
        env:
          # Nilai ini WAJIB ditetapkan dalam Settings > Secrets and variables >
          # Actions > New repository secret, menggunakan anon key Supabase
          # (SELAMAT untuk didedahkan - keselamatan sebenar bergantung kepada RLS).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Tukar 'nama-repo-anda' jika base path perlu dilaraskan secara manual,
          # atau biarkan baris ini dan gunakan Settings > Pages > custom domain.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Muat naik artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
